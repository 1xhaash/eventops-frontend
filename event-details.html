<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventOps · Event Details</title>

  <link href="bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/event-details.css" />
</head>
<body>

  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="topbar__inner">
      <a href="index.html" class="brand">
        <span class="brand__logo"><i class="bi bi-camera-video-fill"></i></span>
        <span class="brand__name">EventOps</span>
      </a>

      <div class="topbar__search">
        <i class="bi bi-search"></i>
        <input type="search" id="globalSearch" placeholder="Search event titles..." />
      </div>

      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="Notifications">
          <i class="bi bi-bell"></i>
          <span class="icon-btn__dot"></span>
        </button>
        <button class="profile" type="button">
          <img src="https://i.pravatar.cc/80?img=12" alt="Beshoy Saeed" class="profile__avatar" />
          <span class="profile__name">Beshoy Saeed</span>
          <i class="bi bi-chevron-down profile__caret"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="event-page">

    <div class="event-back">
      <a href="index.html"><i class="bi bi-arrow-left"></i> Back to events</a>
    </div>

    <!-- ===================== COVER BANNER ===================== -->
    <div class="event-cover">
      <div class="event-cover__badges" id="coverBadges">
        <span class="badge-soft badge-scheduled"><i class="bi bi-calendar-check"></i> Scheduled</span>
        <span class="badge-soft badge-public"><i class="bi bi-globe2"></i> Public</span>
      </div>
      <img id="coverImage" src="" alt="Event cover" />
    </div>

    <div class="row g-4 mt-1">

      <!-- ---------- LEFT: details ---------- -->
      <div class="col-12 col-lg-8">

        <div class="event-head">
          <div>
            <h1 class="event-head__title" id="eventTitle">Loading…</h1>
            <div class="event-organizer">
              Organized by <b id="eventOrganizer">—</b>
            </div>
          </div>
        </div>

        <!-- INFO SECTION -->
        <div class="info-grid" id="infoGrid">

          <div class="info-item">
            <span class="info-item__icon"><i class="bi bi-geo-alt"></i></span>
            <div>
              <div class="info-item__label">Venue</div>
              <div class="info-item__value" id="infoVenue">—</div>
            </div>
          </div>

          <div class="info-item">
            <span class="info-item__icon"><i class="bi bi-calendar3"></i></span>
            <div>
              <div class="info-item__label">Starts At</div>
              <div class="info-item__value" id="infoStarts">—</div>
            </div>
          </div>

          <div class="info-item">
            <span class="info-item__icon"><i class="bi bi-calendar-check"></i></span>
            <div>
              <div class="info-item__label">Ends At</div>
              <div class="info-item__value" id="infoEnds">—</div>
            </div>
          </div>

          <div class="info-item">
            <span class="info-item__icon"><i class="bi bi-clock-history"></i></span>
            <div>
              <div class="info-item__label">Registration Deadline</div>
              <div class="info-item__value" id="infoDeadline">—</div>
              <div class="countdown" id="countdown"><i class="bi bi-hourglass-split"></i> <span>—</span></div>
            </div>
          </div>

          <div class="info-item info-item--wide">
            <span class="info-item__icon"><i class="bi bi-people"></i></span>
            <div class="flex-grow-1">
              <div class="info-item__label">Capacity</div>
              <div class="capacity-top">
                <div class="info-item__value" id="capacityText">—</div>
                <div class="info-item__meta" id="capacityLeft">—</div>
              </div>
              <div class="progress-track"><div class="progress-fill" id="capacityFill" style="width:0%"></div></div>
            </div>
          </div>

          <div class="info-item">
            <span class="info-item__icon"><i class="bi bi-tag"></i></span>
            <div>
              <div class="info-item__label">Price</div>
              <div class="info-item__value" id="infoPrice">—</div>
            </div>
          </div>

        </div>

        <!-- DESCRIPTION -->
        <div class="card-surface mt-4">
          <h3 class="event-desc__title">About this event</h3>
          <p class="event-desc__body" id="eventDescription">—</p>
        </div>

      </div>

      <!-- ---------- RIGHT: sticky booking card ---------- -->
      <div class="col-12 col-lg-4">
        <div class="booking-card" id="bookingCard">
          <div class="booking-card__price-label">Price per ticket</div>
          <div class="booking-card__price" id="bookingPrice">EGP 0</div>

          <div class="booking-card__seats">
            <i class="bi bi-people"></i>
            <span id="bookingSeats">—</span>
          </div>

          <div class="divider-soft"></div>

          <button class="btn-brand" id="selectSeatBtn" type="button">
            <i class="bi bi-grid-3x3-gap"></i> Select your seat
          </button>

          <div class="booking-note" id="bookingNote">
            <i class="bi bi-x-circle"></i> Registration closed
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/event-details.js"></script>
</body>
</html>
