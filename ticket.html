<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventOps · Ticket</title>

  <link href="bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/ticket.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="dashboard.html" class="brand">
        <span class="brand__logo"><i class="bi bi-camera-video-fill"></i></span>
        <span class="brand__name">EventOps</span>
      </a>
      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="Notifications"><i class="bi bi-bell"></i><span class="icon-btn__dot"></span></button>
        <button class="profile" type="button">
          <img src="https://i.pravatar.cc/80?img=12" alt="User" class="profile__avatar" />
          <span class="profile__name">User</span>
          <i class="bi bi-chevron-down profile__caret"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="dashboard.html"><i class="bi bi-house"></i><span>Dashboard</span></a>
        <a class="sidebar__link is-active" href="my-bookings.html"><i class="bi bi-ticket-perforated"></i><span>My Bookings</span></a>
        <a class="sidebar__link" href="profile.html"><i class="bi bi-person"></i><span>Profile</span></a>
        <a class="sidebar__link" href="index.html"><i class="bi bi-globe2"></i><span>Browse events</span></a>
      </nav>
    </aside>

    <main class="content">
      <div class="ticket-area" id="ticketArea"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/ticket.js"></script>
</body>
</html>
