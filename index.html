<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventOps · Discover Events</title>

  <link href="bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/landing.css" />
</head>
<body>

  <!-- ===================== NAVBAR ===================== -->
  <header class="topbar">
    <div class="topbar__inner">
      <a href="index.html" class="brand">
        <span class="brand__logo"><i class="bi bi-camera-video-fill"></i></span>
        <span class="brand__name">EventOps</span>
      </a>

      <div class="auth-btns" id="authButtons">
        <!-- rendered by landing.js -->
      </div>
    </div>
  </header>

  <main class="landing">

    <!-- ===================== HERO ===================== -->
    <section class="lhero">
      <div class="lhero__inner">
        <h1 class="lhero__title">Discover and book <span>events</span></h1>
        <p class="lhero__sub">
          Conferences, workshops, concerts and more — find what's happening near you.
        </p>

        <form class="lhero__search" id="heroSearchForm">
          <i class="bi bi-search"></i>
          <input type="search" id="searchInput" placeholder="Search events by name, venue or keyword..." />
          <button type="submit">Search</button>
        </form>
      </div>
    </section>

    <!-- ===================== LISTING ===================== -->
    <section class="listing container-xl" id="events">

      <div class="listing__head">
        <h2 class="listing__title">
          Upcoming Events <span class="listing__count" id="resultsCount"></span>
        </h2>

        <!-- ========== FILTER ROW ========== -->
        <div class="filters">
          <div class="filter">
            <i class="bi bi-grid-3x3-gap filter__icon"></i>
            <select id="categoryFilter" aria-label="Category">
              <option value="">All categories</option>
              <option value="tech">Technology</option>
              <option value="business">Business</option>
              <option value="music">Music</option>
              <option value="design">Design</option>
              <option value="food">Food & Drink</option>
            </select>
          </div>

          <div class="filter">
            <i class="bi bi-calendar3 filter__icon"></i>
            <select id="dateFilter" aria-label="Date range">
              <option value="">Any date</option>
              <option value="today">Today</option>
              <option value="week">This week</option>
              <option value="month">This month</option>
            </select>
          </div>

          <div class="filter">
            <i class="bi bi-tag filter__icon"></i>
            <select id="priceFilter" aria-label="Price">
              <option value="">Free &amp; paid</option>
              <option value="free">Free</option>
              <option value="paid">Paid</option>
            </select>
          </div>

          <div class="filter filter--sort">
            <i class="bi bi-sort-down filter__icon"></i>
            <select id="sortFilter" aria-label="Sort by">
              <option value="">Date · soonest</option>
              <option value="-startsAt">Date · latest</option>
              <option value="price">Price · low to high</option>
              <option value="-price">Price · high to low</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ========== GRID ========== -->
      <div class="events-grid" id="eventsGrid"></div>

      <!-- ========== PAGINATION ========== -->
      <nav class="pagination" id="pagination" aria-label="Pages"></nav>

    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/landing.js"></script>
</body>
</html>
