<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventOps · Admin overview</title>

  <link href="bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/admin-applications.css" />
  <link rel="stylesheet" href="assets/css/manage.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="dashboard.html" class="brand"><span class="brand__logo"><i class="bi bi-camera-video-fill"></i></span><span class="brand__name">EventOps</span></a>
      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="Notifications"><i class="bi bi-bell"></i><span class="icon-btn__dot"></span></button>
        <button class="profile" type="button"><img src="https://i.pravatar.cc/80?img=12" alt="User" class="profile__avatar" /><span class="profile__name">User</span><i class="bi bi-chevron-down profile__caret"></i></button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content" id="content">
      <div class="page-head">
        <div>
          <h1 class="page-head__title">Admin overview</h1>
          <p class="page-head__sub">Platform-wide activity at a glance.</p>
        </div>
        <a class="btn btn--primary" href="admin-applications.html"><i class="bi bi-clipboard-check"></i> Review applications</a>
      </div>

      <div class="stat-grid" id="statGrid" style="margin-bottom:22px;"></div>

      <div class="two-col" style="grid-template-columns:1.6fr 1fr;">
        <div class="panel" style="margin:0;">
          <div class="panel__head"><h3 class="panel__title"><i class="bi bi-graph-up-arrow"></i> Revenue over time</h3></div>
          <div class="bar-chart" id="revenueChart"></div>
        </div>

        <div class="panel" style="margin:0;">
          <div class="panel__head"><h3 class="panel__title"><i class="bi bi-activity"></i> Recent activity</h3></div>
          <ul class="ticket-list" id="activityList"></ul>
        </div>
      </div>

      <div class="panel" style="margin-top:20px;">
        <div class="panel__head"><h3 class="panel__title"><i class="bi bi-trophy"></i> Top events</h3></div>
        <div class="table-wrap">
          <table class="table-simple">
            <thead><tr><th>Event</th><th>Ticket price</th><th style="text-align:right;">Tickets sold</th><th style="text-align:right;">Revenue</th></tr></thead>
            <tbody id="topEventsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/manage.js"></script>
  <script src="assets/js/admin-dashboard.js"></script>
</body>
</html>
