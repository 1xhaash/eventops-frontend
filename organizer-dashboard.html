<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventOps · My events</title>

  <link href="bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/organizer-dashboard.css" />
</head>
<body>

  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="topbar__inner">
      <a href="organizer-dashboard.html" class="brand">
        <span class="brand__logo"><i class="bi bi-camera-video-fill"></i></span>
        <span class="brand__name">EventOps</span>
      </a>
      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="Notifications">
          <i class="bi bi-bell"></i><span class="icon-btn__dot"></span>
        </button>
        <button class="profile" type="button">
          <img src="https://i.pravatar.cc/80?img=12" alt="User" class="profile__avatar" />
          <span class="profile__name">User</span>
          <i class="bi bi-chevron-down profile__caret"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar__nav">
        <a class="sidebar__link is-active" href="organizer-dashboard.html"><i class="bi bi-house"></i><span>Dashboard</span></a>
        <a class="sidebar__link" href="organizer-dashboard.html"><i class="bi bi-calendar3"></i><span>My events</span></a>
        <a class="sidebar__link" href="create-event.html"><i class="bi bi-plus-square"></i><span>Create event</span></a>
        <a class="sidebar__link" href="my-bookings.html"><i class="bi bi-ticket-perforated"></i><span>My bookings</span></a>
        <a class="sidebar__link" href="profile.html"><i class="bi bi-person"></i><span>Profile</span></a>
        <a class="sidebar__link" href="index.html"><i class="bi bi-globe2"></i><span>Browse events</span></a>
      </nav>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="content">

      <div class="page-head">
        <div>
          <h1 class="page-head__title">My events</h1>
          <p class="page-head__sub">Create, track, and manage the events you organize.</p>
        </div>
        <a class="btn-brand" href="create-event.html"><i class="bi bi-plus-lg"></i> Create Event</a>
      </div>

      <div class="row g-3 g-lg-4" id="statCards"></div>

      <div class="info-note" id="backendNote">
        <i class="bi bi-info-circle info-note__icon"></i>
        <span class="info-note__text">Showing all events you organize, including private, cancelled, and completed events.</span>
        <button class="info-note__close" type="button" aria-label="Dismiss">&times;</button>
      </div>

      <div class="section-head">
        <h2 class="section-head__title">Events</h2>
      </div>
      <div id="eventsWrap"></div>

    </main>
  </div>

  <!-- ===================== TOASTS ===================== -->
  <div class="toast-stack" id="toastStack"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/organizer-dashboard.js"></script>
</body>
</html>
