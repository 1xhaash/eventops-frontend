<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventOps · Organizer applications</title>

  <link href="bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/admin-applications.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="admin-applications.html" class="brand"><span class="brand__logo"><i class="bi bi-camera-video-fill"></i></span><span class="brand__name">EventOps</span></a>
      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="Notifications"><i class="bi bi-bell"></i><span class="icon-btn__dot"></span></button>
        <button class="profile" type="button"><img src="https://i.pravatar.cc/80?img=12" alt="User" class="profile__avatar" /><span class="profile__name">User</span><i class="bi bi-chevron-down profile__caret"></i></button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar__nav">
        <a class="sidebar__link is-active" href="admin-applications.html"><i class="bi bi-clipboard-check"></i><span>Organizer applications</span></a>
        <a class="sidebar__link" href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
        <a class="sidebar__link" href="my-bookings.html"><i class="bi bi-ticket-perforated"></i><span>My bookings</span></a>
        <a class="sidebar__link" href="profile.html"><i class="bi bi-person"></i><span>Profile</span></a>
        <a class="sidebar__link" href="index.html"><i class="bi bi-globe2"></i><span>Browse events</span></a>
      </nav>
    </aside>

    <main class="content" id="content">
      <div class="page-head">
        <div>
          <h1 class="page-head__title">Organizer applications</h1>
          <p class="page-head__sub">Review requests from participants who want to become organizers.</p>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar">
          <div class="toolbar__tabs" id="statusTabs">
            <button class="tab is-active" type="button" data-status="all">All</button>
            <button class="tab" type="button" data-status="pending">Pending</button>
            <button class="tab" type="button" data-status="approved">Approved</button>
            <button class="tab" type="button" data-status="rejected">Rejected</button>
          </div>
          <div class="toolbar__search">
            <i class="bi bi-search"></i>
            <input type="search" id="searchInput" placeholder="Search this page by name, email, or organization" autocomplete="off" />
          </div>
        </div>

        <div class="table-wrap">
          <table class="app-table">
            <thead>
              <tr>
                <th>Applicant name</th>
                <th>Email</th>
                <th>Organization</th>
                <th>Submitted</th>
                <th>Status</th>
                <th class="app-actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="appTableBody"></tbody>
          </table>
        </div>

        <div class="table-foot" id="tableFoot">
          <span class="table-foot__info" id="pageInfo">Page 1 of 1</span>
          <div class="pagination">
            <button class="page-btn" type="button" id="prevBtn"><i class="bi bi-chevron-left"></i> Prev</button>
            <button class="page-btn" type="button" id="nextBtn">Next <i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Application details">
    <div class="drawer__head">
      <h2 class="drawer__title">Application details</h2>
      <button class="drawer__close" type="button" id="drawerClose" aria-label="Close">&times;</button>
    </div>
    <div class="drawer__body" id="drawerBody"></div>
  </aside>

  <div class="toast-stack" id="toastStack"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/admin-applications.js"></script>
</body>
</html>
