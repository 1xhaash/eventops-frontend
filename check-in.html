<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventOps · Check-in</title>

  <link href="bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/admin-applications.css" />
  <link rel="stylesheet" href="assets/css/manage.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="dashboard.html" class="brand"><span class="brand__logo"><i class="bi bi-camera-video-fill"></i></span><span class="brand__name">EventOps</span></a>
      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="Notifications"><i class="bi bi-bell"></i><span class="icon-btn__dot"></span></button>
        <button class="profile" type="button"><img src="https://i.pravatar.cc/80?img=12" alt="User" class="profile__avatar" /><span class="profile__name">User</span><i class="bi bi-chevron-down profile__caret"></i></button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content" id="content">
      <div class="page-head">
        <div>
          <h1 class="page-head__title">Check-in</h1>
          <p class="page-head__sub" id="pageSub">Scan attendee tickets at the door.</p>
        </div>
        <div class="field" style="margin:0; min-width: 240px;">
          <select class="select" id="eventPicker" aria-label="Select event"></select>
        </div>
      </div>

      <div class="two-col">
        <div class="panel" style="margin:0;">
          <div class="scanner">
            <div class="scanner__frame"></div>
            <div class="scanner__corners"><span></span><span></span><span></span><span></span></div>
            <div class="scanner__line"></div>
            <div class="scanner__hint"><i class="bi bi-qr-code-scan"></i> Point the camera at the ticket QR</div>
          </div>

          <div style="margin-top:18px;">
            <label class="field__label" for="manualToken">Enter token manually</label>
            <div style="display:flex; gap:10px;">
              <input class="input" id="manualToken" placeholder="Paste the QR token (64 hex chars)" autocomplete="off" />
              <button class="btn btn--primary" type="button" id="manualBtn"><i class="bi bi-check2-circle"></i> Check in</button>
            </div>
            <p class="field__hint">Camera scanning needs an HTTPS origin; use the manual token entry to check attendees in.</p>
          </div>
        </div>

        <div>
          <div class="scan-result" id="resultCard">
            <div class="scan-result__icon"><i class="bi bi-upc-scan"></i></div>
            <h2 class="scan-result__name">Ready to scan</h2>
            <p class="scan-result__meta">The result of the last scan will appear here.</p>
          </div>

          <div class="panel" style="margin-top:20px;">
            <div class="panel__head">
              <h3 class="panel__title"><i class="bi bi-people"></i> Live attendance</h3>
            </div>
            <div style="display:flex; align-items:baseline; gap:10px; margin-bottom:12px;">
              <span id="checkedCount" style="font-size:32px; font-weight:800;">0</span>
              <span class="muted" id="capacityText">/ 0 checked in</span>
            </div>
            <div class="progress"><div class="progress__bar progress__bar--green" id="attendanceBar" style="width:0%"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/manage.js"></script>
  <script src="assets/js/check-in.js"></script>
</body>
</html>
