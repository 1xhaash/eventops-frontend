<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventOps · Event Reports</title>

  <link href="bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/admin-applications.css" />
  <link rel="stylesheet" href="assets/css/manage.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="dashboard.html" class="brand"><span class="brand__logo"><i class="bi bi-camera-video-fill"></i></span><span class="brand__name">EventOps</span></a>
      <div class="topbar__actions">
        <button class="icon-btn" type="button" aria-label="Notifications"><i class="bi bi-bell"></i><span class="icon-btn__dot"></span></button>
        <button class="profile" type="button"><img src="https://i.pravatar.cc/80?img=12" alt="User" class="profile__avatar" /><span class="profile__name">User</span><i class="bi bi-chevron-down profile__caret"></i></button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="content" id="content">
      <div class="page-head">
        <div>
          <h1 class="page-head__title">Event reports</h1>
          <p class="page-head__sub" id="pageSub">Bookings, attendance and revenue.</p>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
          <select class="select" id="eventPicker" aria-label="Select event" style="min-width:220px;"></select>
          <button class="btn btn--primary" type="button" id="exportBtn"><i class="bi bi-file-earmark-excel"></i> Export to Excel</button>
        </div>
      </div>

      <div class="stat-grid" id="statGrid" style="margin-bottom:22px;"></div>

      <div class="two-col" style="grid-template-columns:1fr 1fr;">
        <div class="panel" style="margin:0;">
          <div class="panel__head"><h3 class="panel__title"><i class="bi bi-bar-chart-line"></i> Bookings by status</h3></div>
          <div class="bar-chart" id="barChart"></div>
        </div>

        <div class="panel" style="margin:0;">
          <div class="panel__head"><h3 class="panel__title"><i class="bi bi-pie-chart"></i> Attendance</h3></div>
          <div class="donut-wrap">
            <div class="donut" id="donut"><div class="donut__hole"><div><div class="donut__pct" id="donutPct">0%</div><div class="donut__cap">attended</div></div></div></div>
            <div class="legend" id="legend"></div>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:20px;">
        <div class="panel__head"><h3 class="panel__title"><i class="bi bi-table"></i> Summary</h3></div>
        <div class="table-wrap">
          <table class="table-simple">
            <tbody id="summaryBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/manage.js"></script>
  <script src="assets/js/reports.js"></script>
</body>
</html>
